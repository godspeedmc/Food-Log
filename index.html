const ds={'油尖旺':['旺角','尖沙咀','佐敦','油麻地'],'灣仔':['灣仔','銅鑼灣'],'觀塘':['觀塘','九龍灣','牛頭角'],'深水埗':['深水埗','長沙灣','荔枝角'],'沙田':['沙田','大圍','馬鞍山'],'中西區':['中環','上環','西環'],'東區':['北角','鰂魚涌','太古','柴灣'],'荃灣':['荃灣'],'屯門':['屯門'],'元朗':['元朗','天水圍'],'大埔':['大埔'],'西貢':['西貢','將軍澳'],'葵青':['葵芳','葵涌','青衣'],'九龍城':['九龍城','紅磡','土瓜灣'],'黃大仙':['黃大仙','新蒲崗'],'南區':['香港仔','黃竹坑'],'北區':['上水','粉嶺'],'離島':['東涌','愉景灣']};function district(x){let h=(x.area+' '+x.address);return Object.keys(ds).find(d=>ds[d].some(k=>h.includes(k)))||'未分類'}function renderMap(){let a=[...state.main,...state.anniversary],counts={};a.forEach(x=>counts[district(x)]=(counts[district(x)]||0)+1);let groups=[['九龍',['油尖旺','深水埗','九龍城','黃大仙','觀塘']],['香港島',['中西區','灣仔','東區','南區']],['新界',['荃灣','屯門','元朗','北區','大埔','沙田','西貢','葵青','離島']]];$('#map').innerHTML='<section class="hero"><h2>Hong Kong food map</h2><p>'+a.length+' logged places</p></section><div class="regions">'+groups.map(g=>'<section class="region"><h3>'+g[0]+'</h3><div class="districts">'+g[1].map(d=>'<button class="district '+(counts[d]?'has':'')+'" data-d="'+d+'"><b>'+(counts[d]||0)+'</b>'+d+'</button>').join('')+'</div></section>').join('')+'</div><div class="results" id="results"></div>';document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{$('#results').innerHTML=a.filter(x=>district(x)===b.dataset.d).map(x=>'<article class="card"><h3>'+esc(x.name)+'</h3><div class="source-actions">'+buttons(x)+'</div></article>').join('')||'<div class="empty">No places.</div>';$('#results').scrollIntoView({behavior:'smooth'})})}

$('#form').onsubmit=async e=>{e.preventDefault();let x={name:$('#name').value,instagramUrl:$('#instagramUrl').value,openriceUrl:$('#openriceUrl').value,area:$('#area').value,cuisine:$('#cuisine').value,address:$('#address').value,phone:$('#phone').value,note:$('#note').value,budget:$('#budget').value,visited:false,rating:'',status:'Candidate'};let error;if(editId){({error}=await db.from('restaurants').update(toDb({...state[page].find(y=>y.id==editId),...x},page)).eq('id',editId))}else{({error}=await db.from('restaurants').insert(toDb(x,page)))}if(error)return showError(error);reset();modal.classList.remove('open');await loadData()};$('#exportBtn').onclick=exportBackup;$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{const file=e.target.files&&e.target.files[0];if(file)importBackup(file)};$('#add').onclick=open;$('#close').onclick=e=>{e.preventDefault();e.stopPropagation();reset();$('#modal').classList.remove('open')};$('#modal').onclick=e=>{if(e.target===$('#modal')){reset();$('#modal').classList.remove('open')}};$('#search').oninput=render;mainTab.onclick=()=>{page='main';filter='all';render()};annTab.onclick=()=>{page='anniversary';filter='all';render()};mapTab.onclick=()=>{page='map';render()};if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./service-worker.js');loadData();
</script></body></html>
